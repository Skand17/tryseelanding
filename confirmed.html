<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Email confirmed – Trysee</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1c0609">
<link rel="stylesheet" href="legal.css">
<style>form{display:grid;gap:12px;max-width:340px;margin:20px auto;text-align:left}input{padding:11px;border:1px solid #d8c9c6;border-radius:10px;font:inherit}button{padding:12px;border:0;border-radius:99px;background:#2b2023;color:#fff;font:inherit;font-weight:600;cursor:pointer}#m{min-height:1.4em}.err{color:#b3261e}.ok{color:#1b7a43}</style>
</head>
<body>
<main style="text-align:center;margin-top:12vh">
  <h1 id="t">Email confirmed</h1>
  <p id="b">Your Trysee account is ready. Go back to the extension and sign in.</p>
  <p><a href="index.html">Back to Trysee</a></p>
</main>
<script>
  // A bad or expired link comes back as #error_description=… in the address.
  var h = new URLSearchParams(location.hash.slice(1));
  if (h.get("error")) {
    document.getElementById("t").textContent = "That link didn't work";
    document.getElementById("b").textContent = "It may have expired. Open the extension, sign up again with the same email, and we'll send a new link.";
  }
</script>
</body>
</html>
