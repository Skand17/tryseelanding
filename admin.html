<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trysee Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1c0609">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="bar" id="bar" hidden>
  <div class="bar-in">
    <span class="brand">Trysee <b>Admin</b></span>
    <div class="bar-ctl">
      <label class="sr" for="range">Date range</label>
      <select id="range">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="365">Last 365 days</option>
      </select>
      <button type="button" class="btn small ghost" id="refresh">Refresh</button>
      <span class="upd" id="updated" aria-live="polite"></span>
      <span class="who" id="whoEmail"></span>
      <button type="button" class="btn small ghost" id="signOut">Sign out</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Dashboard sections" id="tabs"></nav>
</header>

<main id="main">
  <section id="loading" class="card narrow" hidden><p class="muted">Loading…</p></section>

  <section id="auth" class="card narrow" hidden aria-labelledby="authTitle">
    <h1 id="authTitle">Trysee Admin</h1>
    <p class="muted">Sign in with your Trysee account. Access is decided by the server.</p>
    <form id="formIn" class="form" novalidate>
      <label>Email<input id="inEmail" type="email" autocomplete="email" maxlength="120" required></label>
      <label>Password<input id="inPass" type="password" autocomplete="current-password" maxlength="72" required></label>
      <button type="submit" class="btn" id="inGo">Sign in</button>
      <p id="authMsg" class="msg" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section id="denied" class="card narrow" hidden role="alert">
    <h1>This account doesn't have access</h1>
    <p class="muted">Sign out and use a different account.</p>
    <button type="button" class="btn" id="deniedOut">Sign out</button>
  </section>

  <div id="app" hidden>
    <p id="flash" class="flash" role="status" aria-live="polite" hidden></p>
    <div id="errbar" class="errbar" role="alert" hidden><span id="errmsg"></span><button type="button" class="btn small" id="retry">Retry</button></div>
    <div id="panels"></div>
  </div>
</main>

<div id="confirmBox" class="confirm" hidden role="alertdialog" aria-modal="true" aria-labelledby="confirmText">
  <div class="confirm-card">
    <p id="confirmText"></p>
    <div class="row"><button type="button" class="btn" id="confirmYes">Confirm</button><button type="button" class="btn ghost" id="confirmNo">Cancel</button></div>
  </div>
</div>
<div id="tip" class="tip" hidden></div>
<script src="admin.js"></script>
</body>
</html>
